name: Nhật ký thay đổi

# Sau mỗi lần đẩy lên GitHub, ghi ai đẩy, lúc nào, từng commit và từng file vào nhánh `nhat-ky`.
# Chỉ ghi lại, không chặn hay duyệt thay đổi.
on:
  push:
    branches-ignore: [nhat-ky]
  delete:

permissions:
  contents: write

jobs:
  ghi:
    name: Ghi nhật ký
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Ghi vào nhánh nhat-ky
        run: node tools/nhat-ky.mjs ghi
